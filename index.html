<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de CEP</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous" />
</head>

<body class="bg-light">

  <div class="container py-5">
    <div class="card shadow rounded-4 p-4">
      <h2 class="text-center mb-4">Consulta de Endereço por CEP</h2>

      <form class="row g-3">
        <div class="col-12">
          <label for="cep" class="form-label">CEP</label>
          <input id="cep" type="text" class="form-control" placeholder="Digite o CEP">
        </div>
<br>x   
        <div class="col-12 d-grid">
          <button id="pesquisar" type="button" class="btn btn-primary btn-lg">Pesquisar</button>
        </div>

        <div class="col-md-6">
          <label for="logradouro" class="form-label">Logradouro</label>
          <input id="logradouro" type="text" class="form-control">
        </div>

        <div class="col-md-6">
          <label for="numero" class="form-label">Número</label>
          <input id="numero" type="text" class="form-control">
        </div>

        <div class="col-md-6">
          <label for="complemento" class="form-label">Complemento</label>
          <input id="complemento" type="text" class="form-control">
        </div>

        <div class="col-md-6">
          <label for="bairro" class="form-label">Bairro</label>
          <input id="bairro" type="text" class="form-control">
        </div>

        <div class="col-12">
          <label for="telefone" class="form-label">Telefone</label>
          <input id="telefone" type="text" class="form-control">
        </div>
      </form>
    </div>
  </div>

  <!-- Seu JavaScript -->
  <script src="./js/main.js"></script>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ho+j7jyWK8fNQe+A12GyVvXg5g0yzkeWEk1cZjZ41uZmQ8j+NvnzKSeP9DOMC6w2"
    crossorigin="anonymous"></script>

</body>

</html>
